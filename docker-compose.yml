version: "3.8"

services:
  bot:
    build: .
    container_name: utility-bot
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    command: ["bun", "index.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bot-data:/app/data

volumes:
  bot-data:
